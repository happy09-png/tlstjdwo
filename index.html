<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PokéRogue</title>
    <!-- [필수] link 태그 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 전체 게임 화면 창 -->
    <div id="game-screen">
        
        <!-- 상단 어두운 바 -->
        <div class="top-bar"></div>

        <!-- 하늘색 배경 영역 (로고 및 문구) -->
        <div class="sky-area">
            <div class="logo-box">
                <!-- [필수] img (alt 포함), h1, span, h2 -->
                <img src="https://raw.githubusercontent.com/pageow/pokerogue-offline/main/public/images/app_icon.png" alt="포켓로그 로고" id="logo-icon">
                <h1>PokéRogue</h1>
                <span class="version">v1.12.8.11</span>
                <h2>보상으로 알을 드립니다!</h2>
            </div>
        </div>

        <!-- 갈색 배경 영역 (접속 정보 및 메뉴) -->
        <div class="ground-area">
            
            <!-- 오른쪽 상단 유저 접속 정보 -->
            <div class="user-info">
                <!-- [필수] p, br, a -->
                <p>
                    위기 탈출 온라인<br>
                    현재 로그인: <a href="#" class="user-id">xdock</a>
                </p>
            </div>

            <!-- [필수] 구조용 태그 (h3, ol, table, tr, th, td) -->
            <div class="hidden-info">
                <h3>게임 상세 정보</h3>
                <ol>
                    <li>메인 메뉴</li>
                </ol>
                <table>
                    <tr>
                        <th>상태</th>
                        <td>온라인</td>
                    </tr>
                </table>
            </div>

            <!-- 오른쪽 하단 메뉴 상자 -->
            <div id="menu-box">
                <!-- [필수] ul, li, span -->
                <ul class="menu-list">
                    <li class="menu-item"><span class="cursor">▶</span>계속하기</li>
                    <li class="menu-item">새 게임</li>
                    <li class="menu-item">불러오기</li>
                    <li class="menu-item">플레이 이력</li>
                    <li class="menu-item">설정</li>
                </ul>
            </div>

        </div>

        <!-- 하단 어두운 바 -->
        <div class="bottom-bar"></div>

    </div>

</body>
</html>
