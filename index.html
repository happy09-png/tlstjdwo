<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéRogue 메인 화면</title>
    <!-- 필수 요소: link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 필수 요소: div, id, class -->
    <div id="game-screen" class="screen-container">
        
        <!-- 상단 제목 및 로고 영역 -->
        <div class="header-section">
            <!-- 필수 요소: img (alt 포함) -->
            <img src="https://raw.githubusercontent.com/PokeRogue/PokeRogue/main/public/images/logo.png" alt="포케로그 게임 로고" class="game-logo">
            
            <!-- 필수 요소: h1, h2, h3 -->
            <h1 id="main-title" class="title-text">PokéRogue</h1>
            <h2 class="sub-title">행운을 빌어요!</h2>
            <h3 class="version-info">v1.12.0.11</h3>
        </div>

        <!-- 우측 상단 플레이어 정보 및 서버 상태 표 -->
        <div class="info-section">
            <!-- 필수 요소: p, span, br -->
            <p class="user-status">
                <span>4440</span> 플레이어 온라인 <br>
                현재 로그인됨: <span id="username">widgrk</span>
            </p>

            <!-- 필수 요소: 표 (table, tr, th, td) -->
            <table class="server-table">
                <tr>
                    <th>서버</th>
                    <th>상태</th>
                </tr>
                <tr>
                    <td>한국 서버</td>
                    <td>원활</td>
                </tr>
            </table>
        </div>

        <!-- 하단 영역 (공지사항 및 메뉴) -->
        <div class="bottom-section">
            <!-- 필수 요소: ol, li -->
            <div class="notice-box">
                <p class="notice-title">게임 안내</p>
                <ol class="notice-list">
                    <li>방향키와 Enter 키로 조작합니다.</li>
                    <li>세이브 데이터는 자동 저장됩니다.</li>
                </ol>
            </div>

            <!-- 필수 요소: ul, li, a (메뉴 박스) -->
            <div id="menu-box" class="game-menu">
                <ul class="menu-list">
                    <li><a href="#" class="menu-link active">▶ 계속하기</a></li>
                    <li><a href="#" class="menu-link">새 게임</a></li>
                    <li><a href="#" class="menu-link">불러오기</a></li>
                    <li><a href="#" class="menu-link">플레이 이력</a></li>
                    <li><a href="#" class="menu-link">설정</a></li>
                </ul>
            </div>
        </div>

    </div>

</body>
</html>
