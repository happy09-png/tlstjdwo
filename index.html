<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PokéRogue</title>
    <!-- [필수] link 태그 (CSS 연결) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 전체 게임 화면 박스 -->
    <div id="game-frame">

        <!-- 1. 상단 어두운 바 -->
        <div class="top-bar"></div>

        <!-- 2. 하늘색 로고 영역 -->
        <div class="sky-section">
            <div class="logo-wrap">
                <!-- [필수] img (alt 포함 - 절대로 안 깨지는 아이콘) -->
                <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ee1515' stroke='%23222' stroke-width='8'/><path d='M 5,50 A 45,45 0 0,0 95,50 Z' fill='%23ffffff'/><line x1='5' y1='50' x2='95' y2='50' stroke='%23222' stroke-width='8'/><circle cx='50' cy='50' r='15' fill='%23ffffff' stroke='%23222' stroke-width='6'/></svg>" alt="포켓볼 로고" id="logo-img">
                
                <!-- [필수] h1, span, h2 -->
                <h1>PokéRogue</h1>
                <span class="version-badge">v1.12.8.11</span>
                <h2>보상으로 알을 드립니다!</h2>
            </div>
        </div>

        <!-- 3. 갈색 필드 영역 -->
        <div class="ground-section">

            <!-- 오른쪽 상단 접속 정보 -->
            <div id="user-panel">
                <!-- [필수] p, br, a -->
                <p class="server-text">
                    위기 탈출 온라인<br>
                    현재 로그인: <a href="#" class="user-link">xdock</a>
                </p>
                
                <!-- [필수] table, tr, th, td (서버 상태 표로 디자인에 포함) -->
                <table class="status-table">
                    <tr>
                        <th>서버</th>
                        <td>온라인</td>
                    </tr>
                </table>
            </div>

            <!-- 오른쪽 하단 메뉴 박스 -->
            <div id="menu-box">
                <!-- [필수] h3 -->
                <h3 class="menu-header">메인 메뉴</h3>

                <!-- [필수] ul, li, span -->
                <ul class="menu-ul">
                    <li class="menu-item"><span class="arrow">▶</span>계속하기</li>
                    <li class="menu-item">새 게임</li>
                    <li class="menu-item">불러오기</li>
                    <li class="menu-item">플레이 이력</li>
                    <li class="menu-item">설정</li>
                </ul>

                <!-- [필수] ol, li (기록 표시로 메뉴 하단에 포함) -->
                <div class="history-preview">
                    <ol class="history-list">
                        <li>최근: 200층</li>
                    </ol>
                </div>
            </div>

        </div>

        <!-- 4. 하단 어두운 바 -->
        <div class="bottom-bar"></div>

    </div>

</body>
</html>
